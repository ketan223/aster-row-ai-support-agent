<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aster & Row — Support Center</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM (Development version for easier debug/rendering) -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <!-- Babel for JSX compilation in browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
        }
        .chat-scroll::-webkit-scrollbar {
            width: 6px;
        }
        .chat-scroll::-webkit-scrollbar-track {
            background: transparent;
        }
        .chat-scroll::-webkit-scrollbar-thumb {
            background-color: #cbd5e1;
            border-radius: 3px;
        }
    </style>
</head>
<body class="h-screen overflow-hidden flex flex-col">
    <div id="root" class="h-full flex flex-col"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const themes = {
            default: {
                bg: 'bg-slate-50',
                headerBg: 'bg-white border-slate-200',
                headerText: 'text-slate-900',
                logoBg: 'bg-slate-900 text-white',
                btnPrimary: 'bg-slate-900 hover:bg-slate-800 text-white',
                bubbleUser: 'bg-slate-900 text-slate-100 border border-slate-900',
                bubbleAssistant: 'bg-white text-slate-800 border-slate-200 shadow-sm',
                accentText: 'text-emerald-600',
                accentDot: 'bg-emerald-500',
                btnHeader: 'text-slate-600 border-slate-200 hover:bg-slate-50 hover:text-slate-900',
                btnHeaderActive: 'bg-slate-900 text-white border-slate-900 hover:bg-slate-800',
            },
            ocean: {
                bg: 'bg-sky-50/50',
                headerBg: 'bg-white border-blue-100',
                headerText: 'text-blue-900',
                logoBg: 'bg-blue-600 text-white',
                btnPrimary: 'bg-blue-600 hover:bg-blue-700 text-white',
                bubbleUser: 'bg-blue-600 text-white border border-blue-600',
                bubbleAssistant: 'bg-white text-blue-900 border-blue-100 shadow-sm',
                accentText: 'text-blue-600',
                accentDot: 'bg-blue-500',
                btnHeader: 'text-slate-600 border-slate-200 hover:bg-slate-50 hover:text-slate-900',
                btnHeaderActive: 'bg-blue-600 text-white border-blue-600 hover:bg-blue-700',
            },
            forest: {
                bg: 'bg-stone-50',
                headerBg: 'bg-white border-emerald-100',
                headerText: 'text-emerald-950',
                logoBg: 'bg-emerald-700 text-white',
                btnPrimary: 'bg-emerald-700 hover:bg-emerald-800 text-white',
                bubbleUser: 'bg-emerald-700 text-white border border-emerald-700',
                bubbleAssistant: 'bg-white text-emerald-955 border-emerald-100 shadow-sm',
                accentText: 'text-emerald-600',
                accentDot: 'bg-emerald-500',
                btnHeader: 'text-slate-600 border-slate-200 hover:bg-slate-50 hover:text-slate-900',
                btnHeaderActive: 'bg-emerald-700 text-white border-emerald-700 hover:bg-emerald-800',
            },
            charcoal: {
                bg: 'bg-zinc-900',
                headerBg: 'bg-zinc-950 border-zinc-805',
                headerText: 'text-zinc-100',
                logoBg: 'bg-zinc-800 text-zinc-100 border border-zinc-700',
                btnPrimary: 'bg-zinc-800 hover:bg-zinc-700 text-zinc-100 border border-zinc-700',
                bubbleUser: 'bg-zinc-800 text-zinc-100 border border-zinc-700',
                bubbleAssistant: 'bg-zinc-900 text-zinc-300 border-zinc-800 shadow-sm',
                accentText: 'text-zinc-400',
                accentDot: 'bg-zinc-500',
                btnHeader: 'text-zinc-400 border-zinc-700 hover:bg-zinc-800 hover:text-zinc-100',
                btnHeaderActive: 'bg-zinc-100 text-zinc-900 border-zinc-100 hover:bg-white',
            },
            instagram: {
                bg: 'bg-white',
                headerBg: 'bg-white border-slate-100 shadow-none',
                headerText: 'text-slate-900 font-semibold',
                logoBg: 'bg-gradient-to-tr from-yellow-500 via-red-500 to-purple-600 text-white',
                btnPrimary: 'bg-gradient-to-r from-purple-600 to-pink-600 hover:opacity-90 text-white border-0',
                bubbleUser: 'bg-gradient-to-r from-purple-600 via-pink-500 to-red-500 text-white border-0',
                bubbleAssistant: 'bg-[#efefef] text-slate-800 border-0 shadow-none',
                accentText: 'text-pink-600',
                accentDot: 'bg-pink-500',
                btnHeader: 'text-slate-600 border-slate-200 hover:bg-slate-50 hover:text-slate-900',
                btnHeaderActive: 'bg-gradient-to-r from-purple-600 to-pink-600 text-white border-0 hover:opacity-95',
            },
            whatsapp: {
                bg: 'bg-[#efeae2]',
                headerBg: 'bg-[#075e54] border-0 text-white shadow-md',
                headerText: 'text-white',
                logoBg: 'bg-white text-[#075e54]',
                btnPrimary: 'bg-[#128c7e] hover:bg-[#075e54] text-white border-0',
                bubbleUser: 'bg-[#d9fdd3] text-slate-800 border border-[#d9fdd3] shadow-sm',
                bubbleAssistant: 'bg-white text-slate-800 border-0 shadow-sm',
                accentText: 'text-emerald-300',
                accentDot: 'bg-[#25d366]',
                btnHeader: 'text-white/85 border-white/25 hover:bg-white/10 hover:text-white',
                btnHeaderActive: 'bg-white text-[#075e54] border-white hover:bg-white/95',
            },
            telegram: {
                bg: 'bg-[#e7ebf0]',
                headerBg: 'bg-[#2481cc] border-0 text-white shadow-sm',
                headerText: 'text-white',
                logoBg: 'bg-white text-[#2481cc]',
                btnPrimary: 'bg-[#2481cc] hover:bg-[#2072b5] text-white border-0',
                bubbleUser: 'bg-[#effdde] text-slate-800 border border-[#effdde] shadow-sm',
                bubbleAssistant: 'bg-white text-slate-800 border-0 shadow-sm',
                accentText: 'text-sky-200',
                accentDot: 'bg-[#2481cc]',
                btnHeader: 'text-white/85 border-white/25 hover:bg-white/10 hover:text-white',
                btnHeaderActive: 'bg-white text-[#2481cc] border-white hover:bg-white/95',
            },
            facebook: {
                bg: 'bg-white',
                headerBg: 'bg-white border-slate-100 shadow-sm',
                headerText: 'text-slate-900 font-bold',
                logoBg: 'bg-[#0084ff] text-white',
                btnPrimary: 'bg-[#0084ff] hover:bg-[#0073e6] text-white border-0',
                bubbleUser: 'bg-[#0084ff] text-white border-0',
                bubbleAssistant: 'bg-[#e4e6eb] text-slate-800 border-0',
                accentText: 'text-[#0084ff]',
                accentDot: 'bg-[#0084ff]',
                btnHeader: 'text-slate-600 border-slate-200 hover:bg-slate-50 hover:text-slate-900',
                btnHeaderActive: 'bg-[#0084ff] text-white border-[#0084ff] hover:bg-[#0073e6]',
            }
        };

        // Displays citation cards for source verification.
        function CitationCard({ source }) {
            return (
                <div className="inline-flex items-center gap-1.5 px-2.5 py-1 rounded bg-slate-100 border border-slate-200 text-xs text-slate-600 font-medium mr-1.5 mb-1.5 hover:bg-slate-200 transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="text-slate-500"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/></svg>
                    <span>{source.file}</span>
                    <span className="text-slate-400 font-normal">|</span>
                    <span className="text-slate-500 italic">{source.heading}</span>
                </div>
            );
        }

        // Main App Component
        function App() {
            const [messages, setMessages] = useState([
                {
                    id: 'welcome',
                    role: 'assistant',
                    content: "Hello! Welcome to Aster & Row support. How can I help you with your order, returns, or shipping questions today?"
                }
            ]);
            const [input, setInput] = useState('');
            const [loading, setLoading] = useState(false);
            const [sessionId, setSessionId] = useState(localStorage.getItem('ar_session_id') || '');
            const [handoff, setHandoff] = useState(false);
            const [showDebug, setShowDebug] = useState(false);
            const [debugTrace, setDebugTrace] = useState(null);
            const [themeName, setThemeName] = useState(localStorage.getItem('ar_theme_name') || 'default');
            const t = themes[themeName];

            const messagesEndRef = useRef(null);
            const inputRef = useRef(null);

            useEffect(() => {
                // Initialize session if not present
                if (!sessionId) {
                    const newId = crypto.randomUUID();
                    localStorage.setItem('ar_session_id', newId);
                    setSessionId(newId);
                }
            }, []);

            useEffect(() => {
                scrollToBottom();
            }, [messages, loading, showDebug]);

            useEffect(() => {
                if (!loading) {
                    inputRef.current?.focus();
                }
            }, [loading]);

            const scrollToBottom = () => {
                messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
            };

            const handleSend = async (e) => {
                e.preventDefault();
                if (!input.trim() || loading) return;

                const userMsgText = input;
                setInput('');
                setTimeout(() => {
                    inputRef.current?.focus();
                }, 50);
                
                // Add user message to UI
                const newMsgId = crypto.randomUUID();
                setMessages(prev => [...prev, { id: newMsgId, role: 'user', content: userMsgText }]);
                setLoading(true);

                try {
                    const response = await fetch('/api/chat', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ message: userMsgText, session_id: sessionId })
                    });
                    const data = await response.json();
                    
                    if (data.session_id && data.session_id !== sessionId) {
                        localStorage.setItem('ar_session_id', data.session_id);
                        setSessionId(data.session_id);
                    }

                    // Add assistant response
                    setMessages(prev => [...prev, {
                        id: crypto.randomUUID(),
                        role: 'assistant',
                        content: data.response,
                        sources: data.sources,
                        handoff: data.handoff
                    }]);

                    if (data.handoff) {
                        setHandoff(true);
                    }

                    // Query debug trace
                    fetchDebugTrace(data.session_id || sessionId);

                } catch (error) {
                    setMessages(prev => [...prev, {
                        id: crypto.randomUUID(),
                        role: 'assistant',
                        content: "I'm having trouble connecting to the support server. Please try again later.",
                        error: true
                    }]);
                } finally {
                    setLoading(false);
                }
            };

            const handleReset = async () => {
                if (loading) return;
                try {
                    await fetch('/api/reset', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ session_id: sessionId })
                    });
                } catch (e) {}
                
                // Reset local state
                const newId = crypto.randomUUID();
                localStorage.setItem('ar_session_id', newId);
                setSessionId(newId);
                setHandoff(false);
                setDebugTrace(null);
                setMessages([
                    {
                        id: 'welcome',
                        role: 'assistant',
                        content: "Session reset. Hello! How can I help you with your order, returns, or shipping questions today?"
                    }
                ]);
            };

            const fetchDebugTrace = async (sessId) => {
                try {
                    const res = await fetch(`/api/debug?session_id=${sessId}`);
                    const trace = await res.json();
                    if (!trace.error) {
                        setDebugTrace(trace);
                    }
                } catch (e) {}
            };

            return (
                <div className="flex-1 flex overflow-hidden">
                    {/* Main Chat Interface */}
                    <div className={`flex-1 flex flex-col h-full ${t.bg} transition-all duration-300 ${showDebug ? 'pr-0 lg:pr-[400px]' : ''}`}>
                        {/* Header */}
                        <header className={`h-16 px-6 ${t.headerBg} border-b flex items-center justify-between shrink-0 shadow-sm`}>
                            <div className="flex items-center gap-3">
                                <div className={`w-9 h-9 rounded-lg ${t.logoBg} flex items-center justify-center font-bold text-lg shadow-sm`}>
                                    A
                                </div>
                                <div>
                                    <h1 className={`text-sm font-semibold ${t.headerText}`}>Aster & Row</h1>
                                    <p className={`text-xs ${t.accentText} flex items-center gap-1`}>
                                        <span className={`w-1.5 h-1.5 rounded-full ${t.accentDot} inline-block`}></span>
                                        Support Assistant
                                    </p>
                                </div>
                            </div>
                            <div className="flex items-center gap-3">
                                <div className="flex items-center gap-1 mr-1">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="text-slate-400"><circle cx="13.5" cy="6.5" r=".5" fill="currentColor"/><circle cx="17.5" cy="10.5" r=".5" fill="currentColor"/><circle cx="8.5" cy="7.5" r=".5" fill="currentColor"/><circle cx="6.5" cy="12.5" r=".5" fill="currentColor"/><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.92 0 1.63-.77 1.63-1.7 0-.45-.18-.85-.45-1.15-.27-.3-.45-.7-.45-1.15 0-.93.77-1.63 1.7-1.63h1.83c5.3 0 9.63-4.33 9.63-9.63 0-5.3-4.33-9.63-9.63-9.63z"/></svg>
                                    <select 
                                        value={themeName} 
                                        onChange={e => {
                                            const newTheme = e.target.value;
                                            setThemeName(newTheme);
                                            localStorage.setItem('ar_theme_name', newTheme);
                                        }}
                                        className="bg-white border border-slate-200 text-[11px] font-medium rounded-md px-1.5 py-1 focus:outline-none focus:ring-1 focus:ring-slate-500 text-slate-700"
                                    >
                                        <option value="default">Default</option>
                                        <option value="ocean">Ocean Blue</option>
                                        <option value="forest">Forest Green</option>
                                        <option value="charcoal">Charcoal Dark</option>
                                        <option value="instagram">Instagram Chat</option>
                                        <option value="whatsapp">WhatsApp Chat</option>
                                        <option value="telegram">Telegram Chat</option>
                                        <option value="facebook">Facebook Chat</option>
                                    </select>
                                </div>
                                <button 
                                    onClick={handleReset}
                                    className={`flex items-center gap-1.5 px-3 py-1.5 rounded-md text-xs font-medium border transition-colors ${t.btnHeader}`}
                                    title="Reset current conversation"
                                >
                                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="w-3.5 h-3.5"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
                                    <span>New Chat</span>
                                </button>
                                <button 
                                    onClick={() => setShowDebug(!showDebug)}
                                    className={`flex items-center gap-1.5 px-3 py-1.5 rounded-md text-xs font-medium border transition-colors ${showDebug ? t.btnHeaderActive : t.btnHeader}`}
                                >
                                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="w-3.5 h-3.5"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg>
                                    <span>Debug Trace</span>
                                </button>
                            </div>
                        </header>

                        {/* Chat Messages scroll area */}
                        <div className="flex-1 overflow-y-auto px-6 py-6 chat-scroll flex flex-col gap-4">
                            {messages.map(msg => (
                                <div 
                                    key={msg.id} 
                                    className={`flex flex-col max-w-[80%] ${msg.role === 'user' ? 'self-end items-end' : 'self-start items-start'}`}
                                >
                                    {/* Message box */}
                                    <div className={`px-4 py-3 rounded-2xl shadow-sm leading-relaxed text-sm ${
                                        msg.role === 'user' 
                                            ? `${t.bubbleUser} rounded-tr-none` 
                                            : msg.error 
                                                ? 'bg-red-50 text-red-800 border border-red-200 rounded-tl-none'
                                                : `${t.bubbleAssistant} rounded-tl-none`
                                    }`}>
                                        <p className="whitespace-pre-wrap">{msg.content}</p>
                                    </div>
                                    
                                    {/* Citations/sources when present */}
                                    {msg.sources && msg.sources.length > 0 && (
                                        <div className="mt-2 flex flex-wrap gap-1">
                                            {msg.sources.map((s, idx) => (
                                                <CitationCard key={`${s.file}-${s.heading}-${idx}`} source={s} />
                                            ))}
                                        </div>
                                    )}

                                    {/* Alert for Human Escalation */}
                                    {msg.handoff && (
                                        <div className="mt-2 p-3 bg-amber-50 border border-amber-200 rounded-xl flex items-start gap-2.5 max-w-lg">
                                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="text-amber-600 shrink-0 mt-0.5"><circle cx="18" cy="15" r="3"/><circle cx="9" cy="7" r="4"/><path d="M10 15H6a4 4 0 0 0-4 4v2"/><path d="m21.7 16.4-.9-.3"/><path d="m15.2 13.9-.9-.3"/><path d="m16.6 18.7.3-.9"/><path d="m19.1 12.2.3-.9"/><path d="m19.6 18.7-.4-.8"/><path d="m16.8 12.3-.4-.8"/><path d="m14.3 16.6.8-.4"/><path d="m20.9 14.3.8-.4"/></svg>
                                            <div>
                                                <h4 className="text-xs font-semibold text-amber-800">Human Assistance Recommended</h4>
                                                <p className="text-[11px] text-amber-700 mt-0.5 leading-normal">
                                                    An operational issue or policy conflict has been flagged. Human support will verify and process the resolution.
                                                 </p>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            ))}
                            
                            {loading ? (
                                <div key="loading-indicator" translate="no" className="self-start flex items-center gap-1.5 px-4 py-3 rounded-2xl bg-white border border-slate-200 rounded-tl-none shadow-sm">
                                    <span className="w-2 h-2 rounded-full bg-slate-400 animate-bounce"></span>
                                    <span className="w-2 h-2 rounded-full bg-slate-400 animate-bounce [animation-delay:0.2s]"></span>
                                    <span className="w-2 h-2 rounded-full bg-slate-400 animate-bounce [animation-delay:0.4s]"></span>
                                </div>
                            ) : null}

                            <div ref={messagesEndRef} />
                        </div>

                        {/* Input Area */}
                        <div className={`p-4 ${t.headerBg} border-t shrink-0 shadow-inner`}>
                            <form onSubmit={handleSend} className="flex items-center gap-2 max-w-4xl mx-auto">
                                <input
                                    ref={inputRef}
                                    type="text"
                                    value={input}
                                    onChange={e => setInput(e.target.value)}
                                    placeholder="Ask a question about shipping, returns, order statuses, or products..."
                                    disabled={loading}
                                    className={`flex-1 px-4 py-2.5 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-slate-900 ${t.bg} focus:bg-white text-sm transition-all text-slate-800`}
                                />
                                <button
                                    type="submit"
                                    disabled={loading || !input.trim()}
                                    className={`px-4 py-2.5 ${t.btnPrimary} rounded-xl font-medium text-sm transition-colors flex items-center gap-2 shadow disabled:opacity-50 disabled:cursor-not-allowed`}
                                >
                                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="w-4 h-4"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
                                    <span>Send</span>
                                </button>
                            </form>
                            <p className="text-center text-[10px] text-slate-400 mt-2">
                                Aster & Row support bot checks order records and company documents to assist you.
                            </p>
                        </div>
                    </div>

                    {/* Developer Observability slideout */}
                    {showDebug && (
                        <div className="w-full lg:w-[400px] h-full bg-slate-900 border-l border-slate-800 flex flex-col text-slate-300 shrink-0 absolute right-0 top-0 shadow-2xl z-20 lg:relative">
                            <header className="h-16 px-4 border-b border-slate-800 flex items-center justify-between shrink-0 bg-slate-950">
                                <div className="flex items-center gap-2">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="text-emerald-500 animate-pulse"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
                                    <h2 className="text-sm font-semibold text-slate-100">Live Agent Observability Trace</h2>
                                </div>
                                <button 
                                    onClick={() => setShowDebug(false)}
                                    className="p-1 rounded hover:bg-slate-800 text-slate-400 hover:text-slate-200 transition-colors"
                                    aria-label="Close sidebar"
                                >
                                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="w-5 h-5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                                </button>
                            </header>

                            <div className="flex-1 overflow-y-auto p-4 flex flex-col gap-4 text-xs font-mono">
                                {!debugTrace ? (
                                    <div className="text-center text-slate-500 py-12">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="mx-auto mb-2 text-slate-600"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>
                                        <p>Send a message to see the pipeline execution trace details.</p>
                                    </div>
                                ) : (
                                    <React.Fragment>
                                        <div>
                                            <span className="text-emerald-500 font-semibold">[Session ID]</span>
                                            <div className="bg-slate-950 p-2.5 rounded mt-1 text-[11px] text-slate-400 break-all select-all">{debugTrace.session_id}</div>
                                        </div>

                                        <div>
                                            <span className="text-blue-400 font-semibold">[Retrieved RAG Passages]</span>
                                            <div className="flex flex-col gap-2 mt-1">
                                                {debugTrace.retrieved_chunks && debugTrace.retrieved_chunks.map((chk, i) => (
                                                    <div key={i} className="bg-slate-950 p-2 rounded border border-slate-800">
                                                        <div className="text-slate-400 flex justify-between font-bold border-b border-slate-800 pb-1 mb-1">
                                                            <span className="truncate max-w-[200px]">{chk.filename}</span>
                                                            <span className="text-emerald-500 font-semibold">{(chk.score * 100).toFixed(1)}%</span>
                                                        </div>
                                                        <div className="text-slate-500 italic mb-1">Heading: {chk.heading}</div>
                                                        <div className="text-slate-300 leading-normal line-clamp-4 hover:line-clamp-none transition-all duration-300">{chk.text}</div>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>

                                        <div>
                                            <span className="text-purple-400 font-semibold">[Tool Calls & Execution]</span>
                                            <div className="mt-1 flex flex-col gap-1.5">
                                                {debugTrace.tool_calls && debugTrace.tool_calls.length > 0 ? (
                                                    debugTrace.tool_calls.map((tc, idx) => (
                                                        <div key={idx} className="bg-slate-950 p-2.5 rounded border border-slate-800">
                                                            <div className="text-amber-500 font-bold">Tool: {tc.name}</div>
                                                            <div className="text-slate-400 mt-0.5">Args: {JSON.stringify(tc.arguments)}</div>
                                                            <div className="text-emerald-600 mt-1 font-bold">Sanitized Tool Output:</div>
                                                            <pre className="bg-slate-900 p-1.5 rounded text-[10px] text-slate-400 overflow-x-auto whitespace-pre mt-1">
                                                                {JSON.stringify(JSON.parse(debugTrace.tool_results[idx]), null, 2)}
                                                            </pre>
                                                        </div>
                                                    ))
                                                ) : (
                                                    <div className="text-slate-600 bg-slate-950 p-2 rounded">No tool execution occurred this turn.</div>
                                                )}
                                            </div>
                                        </div>

                                        <div>
                                            <span className="text-yellow-500 font-semibold">[Triggers & Observability Metrics]</span>
                                            <div className="bg-slate-950 p-2.5 rounded mt-1 flex flex-col gap-1.5">
                                                <div className="flex justify-between">
                                                    <span className="text-slate-500">Human Handoff:</span>
                                                    <span className={debugTrace.handoff_triggered ? 'text-amber-500 font-bold' : 'text-slate-600'}>
                                                        {debugTrace.handoff_triggered ? 'YES' : 'NO'}
                                                    </span>
                                                </div>
                                                <div className="flex justify-between">
                                                    <span className="text-slate-500">Fallback Provider:</span>
                                                    <span className={debugTrace.fallback_triggered ? 'text-red-500 font-bold' : 'text-slate-600'}>
                                                        {debugTrace.fallback_triggered ? 'YES' : 'NO'}
                                                    </span>
                                                </div>
                                            </div>
                                        </div>
                                    </React.Fragment>
                                )}
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // Render application
        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(<App />);
    </script>
</body>
</html>
